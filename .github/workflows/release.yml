name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,          target: aarch64-apple-darwin }
          - { os: macos-14,          target: x86_64-apple-darwin }
          - { os: ubuntu-24.04,      target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p hither-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="hither-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hither" dist/
          tar -czf "${name}.tar.gz" -C dist hither
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          ls -l "${name}".tar.gz*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: hither-*.tar.gz*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
