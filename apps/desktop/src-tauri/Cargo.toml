[package]
name = "hither-desktop"
version = "0.1.0-alpha.5"
description = "hither for the menu bar"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

# Standalone on purpose: Tauri pulls in platform UI stacks that the CLI and
# core must not depend on, and Linux CI has no WebKit installed.
[workspace]

[lib]
name = "hither_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hither-core = { path = "../../../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
